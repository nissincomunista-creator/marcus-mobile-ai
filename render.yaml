services:
  - type: web
    name: marcus-mobile-ai
    env: docker
    plan: free
    healthCheckPath: /api/network/host-info
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
